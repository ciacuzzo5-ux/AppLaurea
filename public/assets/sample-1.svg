<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="navyBordeauxBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c1d"/>
      <stop offset="45%" stop-color="#101c3d"/>
      <stop offset="75%" stop-color="#4a0d18"/>
      <stop offset="100%" stop-color="#1f0308"/>
    </linearGradient>
    <linearGradient id="gold1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="50%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FF9800"/>
    </linearGradient>
    <linearGradient id="bordeauxBadge1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b1528"/>
      <stop offset="100%" stop-color="#580a17"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="1000" fill="url(#navyBordeauxBg1)"/>

  <!-- Glows -->
  <circle cx="200" cy="220" r="140" fill="#00E5FF" opacity="0.12" filter="url(#glow)"/>
  <circle cx="650" cy="380" r="180" fill="#FFD54F" opacity="0.12" filter="url(#glow)"/>
  <circle cx="300" cy="780" r="200" fill="#8B1528" opacity="0.15" filter="url(#glow)"/>

  <!-- Laurel Wreath & Cap -->
  <g transform="translate(400, 390)">
    <!-- Laurel Wreath Left -->
    <path d="M-120,40 C-180,-40 -160,-140 -80,-200 C-60,-160 -80,-100 -60,-40 Z" fill="url(#gold1)" opacity="0.95"/>
    <path d="M-150,0 C-210,-60 -190,-160 -110,-210 C-100,-170 -120,-110 -90,-30 Z" fill="url(#gold1)" opacity="0.8"/>
    <path d="M-90,90 C-150,30 -140,-50 -60,-120 C-50,-80 -70,-20 -40,30 Z" fill="url(#gold1)" opacity="0.9"/>

    <!-- Laurel Wreath Right -->
    <path d="M120,40 C180,-40 160,-140 80,-200 C60,-160 80,-100 60,-40 Z" fill="url(#gold1)" opacity="0.95"/>
    <path d="M150,0 C210,-60 190,-160 110,-210 C100,-170 120,-110 90,-30 Z" fill="url(#gold1)" opacity="0.8"/>
    <path d="M90,90 C150,30 140,-50 60,-120 C50,-80 70,-20 40,30 Z" fill="url(#gold1)" opacity="0.9"/>

    <!-- Graduation Cap -->
    <g transform="translate(0, -60)">
      <polygon points="0,-75 145,-20 0,35 -145,-20" fill="#081026" stroke="url(#gold1)" stroke-width="4.5"/>
      <path d="M-85,5 L-85,50 C-85,80 85,80 85,50 L85,5" fill="#050a16" stroke="url(#gold1)" stroke-width="3.5"/>
      <circle cx="0" cy="-20" r="8" fill="url(#gold1)"/>
      <path d="M0,-20 C35,-10 75,20 85,65" fill="none" stroke="url(#gold1)" stroke-width="4"/>
      <polygon points="80,65 92,65 95,100 78,100" fill="url(#gold1)"/>
    </g>
  </g>

  <!-- Confetti -->
  <circle cx="120" cy="180" r="8" fill="#FFD54F" opacity="0.85"/>
  <circle cx="680" cy="200" r="9" fill="#00E5FF" opacity="0.85"/>
  <rect x="620" y="280" width="16" height="9" rx="2" transform="rotate(35 620 280)" fill="#FFD54F"/>
  <rect x="160" y="290" width="18" height="8" rx="2" transform="rotate(-25 160 290)" fill="#FF5252"/>
  <rect x="680" y="520" width="15" height="8" rx="2" transform="rotate(50 680 520)" fill="#69F0AE"/>

  <!-- Badge Name -->
  <g transform="translate(400, 710)">
    <rect x="-240" y="-45" width="480" height="90" rx="45" fill="url(#bordeauxBadge1)" stroke="url(#gold1)" stroke-width="2.5"/>
    <text x="0" y="12" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-weight="800" font-size="32" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">IACUZZO CHIARA 🎓</text>
  </g>

  <g transform="translate(400, 800)">
    <text x="0" y="0" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-weight="700" font-size="22" fill="#FFD54F" text-anchor="middle" letter-spacing="2">FESTA DI LAUREA</text>
    <text x="0" y="34" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-weight="400" font-size="18" fill="#C5D4ED" text-anchor="middle">Ingegneria Informatica 💻</text>
  </g>
</svg>
