<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="navyBordeauxBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a17"/>
      <stop offset="50%" stop-color="#0e1b38"/>
      <stop offset="85%" stop-color="#3b0813"/>
      <stop offset="100%" stop-color="#120206"/>
    </linearGradient>
    <linearGradient id="gold2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="50%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>
    <linearGradient id="champagne2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE57F"/>
      <stop offset="100%" stop-color="#FFD740"/>
    </linearGradient>
    <linearGradient id="bordeauxBadge2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b1528"/>
      <stop offset="100%" stop-color="#580a17"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#navyBordeauxBg2)"/>

  <!-- Sparkles -->
  <circle cx="160" cy="180" r="100" fill="#00E5FF" opacity="0.12"/>
  <circle cx="660" cy="280" r="130" fill="#FFE082" opacity="0.14"/>
  <circle cx="300" cy="750" r="150" fill="#8B1528" opacity="0.12"/>

  <!-- Champagne Flutes -->
  <g transform="translate(400, 380)">
    <g transform="rotate(-18 -40 0)">
      <path d="M-60,-120 L-20,-120 L-25,-20 C-25,10 -55,10 -55,-20 Z" fill="url(#champagne2)" opacity="0.9" stroke="#FFFFFF" stroke-width="3"/>
      <line x1="-40" y1="10" x2="-40" y2="110" stroke="#FFFFFF" stroke-width="4"/>
      <ellipse cx="-40" cy="115" rx="35" ry="8" fill="#FFFFFF" opacity="0.9"/>
      <circle cx="-42" cy="-50" r="4" fill="#FFFFFF"/>
      <circle cx="-35" cy="-80" r="3" fill="#FFFFFF"/>
    </g>

    <g transform="rotate(18 40 0)">
      <path d="M20,-120 L60,-120 L55,-20 C55,10 25,10 25,-20 Z" fill="url(#champagne2)" opacity="0.9" stroke="#FFFFFF" stroke-width="3"/>
      <line x1="40" y1="10" x2="40" y2="110" stroke="#FFFFFF" stroke-width="4"/>
      <ellipse cx="40" cy="115" rx="35" ry="8" fill="#FFFFFF" opacity="0.9"/>
      <circle cx="42" cy="-60" r="4" fill="#FFFFFF"/>
      <circle cx="36" cy="-30" r="3" fill="#FFFFFF"/>
    </g>

    <g transform="translate(0, -90)">
      <polygon points="0,-35 8,-8 35,0 8,8 0,35 -8,8 -35,0 -8,-8" fill="url(#gold2)"/>
      <circle cx="0" cy="0" r="6" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Stars -->
  <g transform="translate(180, 160) scale(0.7)">
    <polygon points="0,-25 6,-6 25,0 6,6 0,25 -6,6 -25,0 -6,-6" fill="#00E5FF"/>
  </g>
  <g transform="translate(620, 180) scale(0.75)">
    <polygon points="0,-25 6,-6 25,0 6,6 0,25 -6,6 -25,0 -6,-6" fill="#FFF9C4"/>
  </g>

  <!-- Badge Text -->
  <g transform="translate(400, 710)">
    <rect x="-240" y="-45" width="480" height="90" rx="45" fill="url(#bordeauxBadge2)" stroke="url(#gold2)" stroke-width="2.5"/>
    <text x="0" y="12" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-weight="800" font-size="34" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">CIN CIN CHIARA! 🥂🍾</text>
  </g>

  <g transform="translate(400, 800)">
    <text x="0" y="0" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-weight="700" font-size="22" fill="#FFE082" text-anchor="middle" letter-spacing="2">FESTEGGIAMENTI INSIEME</text>
    <text x="0" y="34" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-weight="400" font-size="18" fill="#C5D4ED" text-anchor="middle">Alla nostra nuova Ingegnere! ❤️</text>
  </g>
</svg>
