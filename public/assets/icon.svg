<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#800020"/>
      <stop offset="100%" stop-color="#2D000A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFCA28"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#iconBg)"/>
  
  <!-- Laurel Wreath -->
  <g transform="translate(256, 256)">
    <!-- Left Wreath -->
    <path d="M-80,60 C-150,0 -140,-100 -70,-150 C-60,-115 -75,-65 -45,-15 Z" fill="url(#gold)" opacity="0.9"/>
    <path d="M-115,20 C-175,-35 -165,-125 -100,-165 C-95,-130 -110,-85 -85,-35 Z" fill="url(#gold)" opacity="0.75"/>
    <path d="M-55,100 C-115,50 -115,-30 -50,-80 C-40,-50 -60,0 -30,45 Z" fill="url(#gold)" opacity="0.85"/>

    <!-- Right Wreath -->
    <path d="M80,60 C150,0 140,-100 70,-150 C60,-115 75,-65 45,-15 Z" fill="url(#gold)" opacity="0.9"/>
    <path d="M115,20 C175,-35 165,-125 100,-165 C95,-130 110,-85 85,-35 Z" fill="url(#gold)" opacity="0.75"/>
    <path d="M55,100 C115,50 115,-30 50,-80 C40,-50 60,0 30,45 Z" fill="url(#gold)" opacity="0.85"/>

    <!-- Center Graduation Cap -->
    <g transform="translate(0, -40)">
      <polygon points="0,-60 110,-20 0,20 -110,-20" fill="#121212" stroke="url(#gold)" stroke-width="4"/>
      <path d="M-65,-5 L-65,30 C-65,55 65,55 65,30 L65,-5" fill="#1a1a1a" stroke="url(#gold)" stroke-width="3"/>
      <circle cx="0" cy="-20" r="7" fill="url(#gold)"/>
      <path d="M0,-20 C25,-10 55,15 65,45" fill="none" stroke="url(#gold)" stroke-width="3.5"/>
      <polygon points="60,45 70,45 72,75 58,75" fill="url(#gold)"/>
    </g>

    <!-- Camera Icon Overlay in bottom center -->
    <g transform="translate(0, 110)">
      <rect x="-40" y="-30" width="80" height="60" rx="14" fill="#000000" fill-opacity="0.8" stroke="url(#gold)" stroke-width="3"/>
      <circle cx="0" cy="0" r="16" fill="none" stroke="url(#gold)" stroke-width="3"/>
      <circle cx="24" cy="-16" r="4" fill="url(#gold)"/>
    </g>
  </g>
</svg>
